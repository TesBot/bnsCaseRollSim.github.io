<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>剑灵怀旧服开箱模拟器</title>
    <meta name="description" content="剑灵怀旧服游戏开箱模拟器，仅学习交流，无商业用途。" />

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-SSN0BMNVMK"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-SSN0BMNVMK');
    </script>

    <link rel="icon" href="assets/BnSClient.ico" />

    <!-- Tailwind CSS v3 -->
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                900: "#0a0f1a",
                800: "#111827",
                700: "#1c1917",
                500: "#f59e0b",
                400: "#fbbf24"
              }
            },
            boxShadow: {
              glow: "0 0 0 1px rgba(245, 158, 11, 0.35), 0 0 18px rgba(245, 158, 11, 0.5)"
            }
          }
        }
      };
    </script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <!-- 双主题 CSS -->
    <link rel="stylesheet" href="./style2.css" id="themeDark" />
    <link rel="stylesheet" href="./style3.css" id="themeLight" disabled />
  </head>
  <body class="min-h-screen">
    <div class="page-bg"></div>

    <!-- 顶部导航 -->
    <header class="sticky top-0 z-50">
      <nav class="mx-auto flex h-16 w-[95%] max-w-7xl items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="logo-glow flex h-10 w-10 items-center justify-center rounded-lg">
            <img src="assets/BnSClient.ico" alt="剑灵" class="h-8 w-8 object-contain">
          </div>
          <div>
            <p class="text-sm" style="color:var(--ink-light,#94a3b8)">Blade & Soul</p>
            <h1 class="text-base font-bold tracking-wide" style="color:var(--ink,#fbbf24)">剑灵怀旧服开箱模拟器</h1>
          </div>
        </div>
        <div class="flex items-center gap-4">
          <ul class="hidden gap-6 text-sm md:flex" style="color:var(--ink-dim,#d1d5db)">
            <li><a class="nav-link" href="#inventory">我的库存</a></li>
            <li>
              <a class="nav-link flex items-center gap-2" href="https://github.com/TesBot/bnsCaseRollSim.github.io" target="_blank" rel="noopener noreferrer">
                <img class="w-5 h-5 rounded-full transition" style="border:1px solid var(--border,rgba(100,116,139,0.45))" src="https://avatars.githubusercontent.com/u/23382251?v=4" alt="作者头像">
                <span>幸运鸡</span>
              </a>
            </li>
          </ul>
          <!-- 主题切换按钮 -->
          <button id="themeToggle" class="theme-toggle-btn" title="切换主题">
            <i class="fa-solid fa-sun" id="themeIcon"></i>
          </button>
        </div>
      </nav>
    </header>

    <main id="home" class="mx-auto w-[95%] max-w-7xl py-6 md:py-8">
      <section class="grid gap-6 lg:grid-cols-12">
        <!-- 左侧：箱子选择 -->
        <aside class="card-panel lg:col-span-3">
          <h2 class="mb-4 text-lg font-bold" style="color:var(--ink,#fbbf24)">
            <i class="fa-solid fa-box-open mr-2" style="color:var(--accent,#fbbf24)"></i>箱子选择
          </h2>
          <div class="space-y-3">
            <label>
              <span class="mb-1 block text-sm" style="color:var(--ink-dim,#94a3b8)">宝箱类别</span>
              <select id="categorySelect" class="w-full rounded-lg px-3 py-2 text-sm outline-none transition"></select>
            </label>
            <label>
              <span class="mb-1 block text-sm" style="color:var(--ink-dim,#94a3b8)">选择宝箱</span>
              <select id="caseSelect" class="w-full rounded-lg px-3 py-2 text-sm outline-none transition"></select>
            </label>
          </div>
          <div id="caseList" class="mt-3 space-y-2"></div>
        </aside>

        <!-- 中间：开箱操作与结果 -->
        <section class="card-panel lg:col-span-5">
          <h2 class="mb-4 text-lg font-bold" style="color:var(--ink,#fbbf24)">
            <i class="fa-solid fa-gem mr-2" style="color:var(--accent,#fbbf24)"></i>开箱操作
          </h2>
          <p id="selectedCaseDesc" class="mb-3 text-sm" style="color:var(--ink-dim,#94a3b8)"></p>

          <div class="mb-3 flex items-center gap-2">
            <label class="flex items-center gap-2 cursor-pointer select-none">
              <input type="checkbox" id="effectToggle" checked class="sr-only peer">
              <div class="toggle-switch"></div>
              <span class="text-sm" style="color:var(--ink-dim,#d1d5db)">开箱特效</span>
            </label>
          </div>

          <div class="mt-4 grid gap-3 sm:grid-cols-3">
            <label class="sm:col-span-1">
              <span class="mb-1 block text-sm" style="color:var(--ink-dim,#94a3b8)">开箱次数</span>
              <input id="openCount" type="number" min="1" max="1000" value="1"
                class="w-full rounded-lg px-3 py-2 outline-none transition" />
              <p id="openCountError" class="mt-1 text-sm text-red-400 hidden">单次最大开箱1000个</p>
              <p id="inventoryFullError" class="mt-1 text-sm text-red-400 hidden">库存存储已满，请清空库存</p>
            </label>
            <div class="sm:col-span-2 flex items-end gap-3">
              <button id="openBtn" class="btn-primary w-full sm:w-auto">
                <i class="fa-solid fa-bolt mr-2"></i>立即开箱
              </button>
              <button id="clearInventoryBtn" class="btn-secondary w-full sm:w-auto">
                <i class="fa-solid fa-trash mr-2"></i>清空库存
              </button>
            </div>
          </div>

          <!-- 目标挑战 -->
          <div class="mt-4 p-3 rounded-lg" style="border:1px solid var(--border,rgba(245,158,11,0.3));background:var(--bg-card,rgba(15,23,42,0.3))">
            <h3 class="text-sm font-semibold mb-2" style="color:var(--accent,#fbbf24)">
              <i class="fa-solid fa-bullseye mr-1"></i>目标挑战
            </h3>
            <label class="block mb-2">
              <span class="text-xs" style="color:var(--ink-dim,#94a3b8)">选择目标物品</span>
              <select id="targetItemSelect" class="mt-1 w-full rounded-lg px-2 py-1.5 text-xs outline-none transition">
                <option value="">-- 不设置目标 --</option>
              </select>
            </label>
            <div id="targetStatus" class="hidden">
              <div class="flex items-center justify-between text-xs">
                <span style="color:var(--ink-dim,#94a3b8)">已开箱:</span>
                <span id="targetCount" class="font-bold" style="color:var(--accent,#fbbf24)">0 次</span>
              </div>
              <div id="targetProgress" class="mt-1 h-1.5 rounded-full overflow-hidden" style="background:var(--bg-warm,rgba(15,23,42,0.5))">
                <div id="targetProgressBar" class="h-full transition-all duration-300" style="width: 0%;background:var(--accent,#f59e0b)"></div>
              </div>
              <p id="targetWarning" class="mt-1 text-xs text-red-400 hidden"></p>
            </div>
            <button id="clearTargetBtn" class="mt-2 w-full text-xs transition hidden" style="color:var(--ink-light,#6b7280)">
              <i class="fa-solid fa-times mr-1"></i>取消目标
            </button>
          </div>

          <div class="mt-5">
            <h3 class="mb-2 text-sm" style="color:var(--ink-dim,#94a3b8)">本次开箱结果</h3>
            <div id="latestResults" class="result-grid"></div>
          </div>
        </section>

        <!-- 右侧：概率说明 -->
        <aside class="card-panel lg:col-span-4">
          <h2 class="mb-2 text-lg font-bold" style="color:var(--ink,#fbbf24)">
            <i class="fa-solid fa-chart-pie mr-2" style="color:var(--accent,#fbbf24)"></i>概率说明
          </h2>
          <p id="ratesCaseName" class="mb-3 text-xs" style="color:var(--ink-dim,#94a3b8)"></p>
          <div id="rates" class="space-y-2 text-sm"></div>
        </aside>
      </section>

      <!-- 收藏品展示墙 -->
      <section id="collectionWall" class="card-panel mt-6 hidden">
        <div class="mb-4 flex items-center justify-between gap-3">
          <h2 class="text-lg font-bold" style="color:var(--ink,#fbbf24)">
            <i class="fa-solid fa-crown mr-2" style="color:var(--gold,#fbbf24)"></i>出货展示
          </h2>
          <span id="collectionCount" class="text-sm" style="color:var(--gold,#fbbf24)">0 种极稀有物品</span>
        </div>
        <div id="collectionList" class="collection-scroll"></div>
      </section>

      <!-- 库存 -->
      <section id="inventory" class="card-panel mt-6">
        <div class="mb-4 flex items-center justify-between gap-3">
          <h2 class="text-lg font-bold" style="color:var(--ink,#fbbf24)">
            <i class="fa-solid fa-backpack mr-2" style="color:var(--accent,#fbbf24)"></i>我的库存
          </h2>
          <span id="inventoryCount" class="text-sm" style="color:var(--ink-dim,#94a3b8)">总计 0 件</span>
        </div>
        <div id="inventoryList" class="result-grid"></div>
      </section>
    </main>

    <footer class="mt-8 border-t" style="border-color:var(--border,rgba(71,85,105,0.45))">
      <div class="mx-auto w-[95%] max-w-7xl py-5 text-center text-xs" style="color:var(--ink-dim,#94a3b8)">
        <p>© 2026 剑灵开箱模拟器 - 抽奖结果仅供娱乐。</p>
        <p class="mt-1">本网页为练习项目，不涉及实际交易，不代表任何官方平台，若涉及素材请替换为自有资源。</p>
        <p class="mt-3 text-sm" style="color:var(--ink-dim,#d1d5db)">
          <i class="fa-solid fa-comment-dots mr-1" style="color:var(--accent,#fbbf24)"></i>有问题或建议？欢迎在 GitHub 提 Issue 或 PR
        </p>
        <p class="mt-2">
          <a href="https://github.com/TesBot/bnsCaseRollSim.github.io" target="_blank" rel="noopener noreferrer" style="color:var(--accent,#fbbf24)">
            <i class="fa-brands fa-github mr-1"></i>GitHub: TesBot/bnsCaseRollSim
          </a>
        </p>
      </div>
    </footer>

    <!-- 开箱特效浮窗 -->
    <div id="effectModal" class="effect-modal hidden">
      <div class="effect-overlay"></div>
      <div class="effect-content card-panel">
        <h3 id="effectCaseName" class="text-lg font-bold text-center mb-2" style="color:var(--ink,#fbbf24)"></h3>
        <div class="effect-animation-container">
          <div id="sparkParticles" class="spark-particles"></div>
          <div id="openRingEffect" class="open-ring-effect"></div>
          <img id="effectCaseImage" class="effect-case-image" src="" alt="">
          <div id="cloudEffect" class="cloud-effect">
            <div class="cloud-center"></div>
            <div class="cloud-extra left"></div>
            <div class="cloud-extra right"></div>
          </div>
        </div>
        <p id="effectCaseDesc" class="text-sm text-center mt-2" style="color:var(--ink-dim,#94a3b8)"></p>
        <div class="effect-counter mt-3">
          <span style="color:var(--ink-dim,#d1d5db)">剩余: </span>
          <span id="effectRemaining" class="text-2xl font-bold" style="color:var(--accent,#fbbf24)">0</span>
          <span style="color:var(--ink-dim,#94a3b8)"> / </span>
          <span id="effectTotal" style="color:var(--ink-dim,#94a3b8)">0</span>
        </div>
        <div class="effect-items-container mt-3">
          <p class="text-xs mb-1" style="color:var(--ink-dim,#94a3b8)">本次获得:</p>
          <div id="effectItemsList" class="effect-items-list"></div>
        </div>
        <div id="effectConfirmBtnContainer" class="mt-4 hidden">
          <button id="effectConfirmBtn" class="btn-primary w-full">
            <i class="fa-solid fa-check mr-2"></i>确定
          </button>
        </div>
      </div>
    </div>

    <!-- 炫耀弹窗 -->
    <div id="showoffModal" class="showoff-modal hidden">
      <div class="showoff-overlay"></div>
      <div class="showoff-content">
        <button id="showoffShareBtn" class="showoff-share-icon" title="生成分享卡片">
          <i class="fa-solid fa-share-from-square"></i>
        </button>
        <div class="showoff-stars">
          <div class="showoff-star star-1"></div>
          <div class="showoff-star star-2"></div>
          <div class="showoff-star star-3"></div>
          <div class="showoff-star star-4"></div>
          <div class="showoff-star star-5"></div>
          <div class="showoff-star star-6"></div>
        </div>
        <h3 id="showoffTitle" class="showoff-title">极稀有物品!</h3>
        <p id="showoffSubtitle" class="showoff-subtitle">恭喜获得以下珍稀奖励</p>
        <div id="showoffItems" class="showoff-items"></div>
        <button id="showoffConfirmBtn" class="btn-primary showoff-confirm-btn">
          <i class="fa-solid fa-check mr-2"></i>确定
        </button>
      </div>
    </div>

    <script src="./data/mall-cases.js"></script>
    <script src="./data/dungeon-cases.js"></script>
    <script src="./data/normal-cases.js"></script>
    <script src="./data/cases-data.js"></script>
    <script src="./app.js"></script>

    <!-- 主题切换脚本 -->
    <script>
    (function() {
      const THEME_KEY = "bns_theme";
      const darkLink = document.getElementById("themeDark");
      const lightLink = document.getElementById("themeLight");
      const toggleBtn = document.getElementById("themeToggle");
      const icon = document.getElementById("themeIcon");

      function applyTheme(theme) {
        if (theme === "light") {
          darkLink.disabled = true;
          lightLink.disabled = false;
          icon.className = "fa-solid fa-moon";
        } else {
          darkLink.disabled = false;
          lightLink.disabled = true;
          icon.className = "fa-solid fa-sun";
        }
      }

      // 初始化
      const saved = localStorage.getItem(THEME_KEY) || "dark";
      applyTheme(saved);

      toggleBtn.addEventListener("click", function() {
        const current = localStorage.getItem(THEME_KEY) || "dark";
        const next = current === "dark" ? "light" : "dark";
        localStorage.setItem(THEME_KEY, next);
        applyTheme(next);
      });
    })();
    </script>
  </body>
</html>
